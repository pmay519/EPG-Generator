name: Update All EPGs

on:
  schedule:
    - cron: '0 0 * * *' # Runs automatically once every 24 hours
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write  # <-- This grants permission to push changes back to the repo

jobs:
  update-epgs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Pluto Generator
        run: |
          cd Pluto
          python epg_generator.py

      - name: Run Roku Generator
        run: |
          cd Roku
          python epg_generator.py

      - name: Run SamsungPlus Generator
        run: |
          cd SamsungPlus
          python epg_generator.py

      - name: Run Tubi Generator
        run: |
          cd Tubi
          python epg_generator.py

       - name: Run masterlist Generator
        run: |
          cd masterlist
          python epg_generator.py   

          

      - name: Commit and Push Updated EPG Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.io"
          git add .
          git commit -m "Automated daily EPG refresh" || exit 0
          git push