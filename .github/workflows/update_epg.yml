name: Update All EPGs

on:
  schedule:
    - cron: '0 0 * * *' # Runs once every 24 hours
  workflow_dispatch:

jobs:
  update-epgs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run EPG Generator for Folder 1
        run: Pluto/epg_generator.py

      - name: Run EPG Generator for Folder 2
        run: Roku/epg_generator.py

      - name: Run EPG Generator for Folder 3
        run: SamsungPlus/epg_generator.py

      - name: Run EPG Generator for Folder 4
        run: Tubi/epg_generator.py

      - name: Commit and Push Updated EPG Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.io"
          git add .
          git commit -m "Automated daily refresh for all four EPG files" || exit 0
          git push